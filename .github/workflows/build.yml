name: build

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 19
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 19

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew projects clean build --no-daemon --refresh-dependencies

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: unit-tests-${{ matrix.os }}
          fail_ci_if_error: true

  integration-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 19
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 19

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: integration Test
        run: ./gradlew projects clean integrationTest --no-daemon --refresh-dependencies

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: integration-tests-${{ matrix.os }}
          fail_ci_if_error: true

  performance-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 19
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 19

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Performance Test
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 10
          command: ./gradlew projects clean performanceTest --no-daemon --refresh-dependencies

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: performance-tests-${{ matrix.os }}
          fail_ci_if_error: true

  release:
    needs: [ build, integration-test, performance-test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Java 19
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 19

      - name: Bump version
        id: version
        uses: paulhatch/semantic-version@v5.0.3

      - name: Login to ghcr
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker images
        run: ./gradlew jib -Djib.to.tags=${{ steps.version.outputs.version }}

      - name: Create GitHub tag and release
        uses: softprops/action-gh-release@v0.1.15
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          generate_release_notes: true