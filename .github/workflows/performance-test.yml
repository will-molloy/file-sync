name: performance-test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  performance-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 19
        uses: actions/setup-java@v3
        with:
          distribution: corretto
          java-version: 19

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Performance Test
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 10
          command: ./gradlew projects clean performanceTest --no-daemon --refresh-dependencies

      - name: Upload coverage to Codecov (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          flags: performance-tests
          fail_ci_if_error: false